{{- /* Se llama con el evento; `anchor` sustituye al enlace. */ -}}
<article class="ex-course ex-course--featured s-event">
  <div class="ex-course__cover" style="{{ printf "background-image:url('%s')" .image | safeCSS }}"></div>
  <div class="ex-course__body">
    <h3 class="ex-course__title">{{ .title }}</h3>
    <p>{{ .description }}</p>
    <p>{{ .type | default "Evento" }} · {{ .date | dateFormat "2/1/2006" }} · {{ .format | default "Online" }}</p>
    <div class="ex-course__actions"><a class="ex-button ex-button--accent ex-button--block" href="{{ .anchor | default .url }}">Apuntarse</a></div>
  </div>
</article>
