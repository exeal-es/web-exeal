<div class="ex-theme-black"><footer class="ex-footer s-footer">
  <div>
    <a href="/"><img class="ex-footer__logo" src="/exeal-design/img/logo-exeal-footer.svg" alt="Exeal"></a>
    <ul class="ex-footer__links">
      {{ range site.Data.footer.resources }}<li><a href="{{ .url | relLangURL }}">{{ i18n .text }}</a></li>{{ end }}
      {{ range site.Data.footer.links }}<li><a href="{{ .url }}">{{ i18n .text }}</a></li>{{ end }}
      <li><button type="button" class="s-footer-button" data-cookies="open">{{ i18n "footercookies" }}</button></li>
    </ul>
  </div>
  <ul class="ex-footer__social">
    {{ range site.Data.social }}<li><a target="_blank" rel="noopener" href="{{ .url }}"><img src="/assets/img/social/{{ .name }}.svg" alt="{{ if eq .name "email" }}Correo{{ else }}{{ .name | title }}{{ end }}"></a></li>{{ end }}
  </ul>
</footer></div>
