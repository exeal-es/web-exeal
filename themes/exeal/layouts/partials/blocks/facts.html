<section id="{{ .id }}" class="xb-facts {{ .className }}">
  <div class="container">
    <div class="row xb-head">
      <div class="col-lg-10">
        {{ with .kicker }}<p class="xb-kicker">{{ . }}</p>{{ end }}
        <h2 class="xb-hook">{{ .header | safeHTML }}</h2>
      </div>
    </div>
    <div class="row mt-3">
      {{ range .facts }}
      <div class="col-md-6 col-lg-4 mb-4">
        <div class="xb-fact">
          <div class="value">{{ .value | safeHTML }}</div>
          <div class="label">{{ .label }}</div>
          {{ with .detail }}<p class="detail">{{ . | safeHTML }}</p>{{ end }}
        </div>
      </div>
      {{ end }}
    </div>
  </div>
</section>
