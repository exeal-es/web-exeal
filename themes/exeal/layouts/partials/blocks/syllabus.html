<section id="{{ .id }}" class="{{ partial "theme.html" .className }}">
  <div class="s-wrap">
{{ partial "arrow-header.html" . }}
    {{ with .paragraph1 }}<p>{{ . | safeHTML }}</p>{{ end }}
    <div class="ex-grid s-grid-2">
      {{ range .modules }}<div class="ex-box"><span class="ex-box__flap ex-box__flap--tr"></span><span class="ex-dashnum" aria-hidden="true">{{ .index }}</span><h3 class="ex-h4">{{ .title }}</h3><p>{{ .description }}</p></div>{{ end }}
    </div>
    {{ with .paragraph2 }}<p class="s-after">{{ . | safeHTML }}</p>{{ end }}
    {{ with .callToAction }}<div class="s-actions">{{ partial "button.html" . }}</div>{{ end }}
  </div>
</section>
