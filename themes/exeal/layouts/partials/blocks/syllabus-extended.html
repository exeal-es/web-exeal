<section id="{{ .id }}" class="{{ partial "theme.html" .className }}">
  <div class="s-wrap">
{{ partial "arrow-header.html" . }}
    {{ range .chapters }}
    <details class="ex-disclosure"><summary>{{ .chapter }}</summary>
      <div class="ex-disclosure__body">{{ if gt (len .topics) 1 }}<ul class="ex-bullets">{{ range .topics }}<li>{{ . | safeHTML }}</li>{{ end }}</ul>{{ else }}{{ range .topics }}<p>{{ . | safeHTML }}</p>{{ end }}{{ end }}</div>
    </details>
    {{ end }}
  </div>
</section>
