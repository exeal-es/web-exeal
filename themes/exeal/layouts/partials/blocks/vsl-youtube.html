<section id="{{ .id }}" class="{{ partial "theme.html" .className }}">
  <div class="s-wrap">
<h2 class="ex-arrow-title"><span>{{ .header | safeHTML }}</span></h2>
    {{ with .subheader }}<p class="s-lead">{{ . | safeHTML }}</p>{{ end }}
    {{ partial "video.html" (dict "url" .youtubeUrl "title" .header) }}
    {{ with .callToAction }}<div class="s-actions">{{ partial "button.html" . }}</div>{{ end }}
  </div>
</section>
