<section id="{{ .id }}" class="{{ partial "theme.html" .className }}">
  <div class="s-wrap">
{{ partial "arrow-header.html" . }}
    {{ with .p1 }}<p>{{ . | safeHTML }}</p>{{ end }}
    <div class="ex-carousel s-carousel-3" tabindex="0" role="region" aria-label="Cursos">
      {{ range site.Data.onlinecourses }}{{ partial "course-card.html" (dict "image" .image "title" .title "text" .description "href" .url "cta" "Ver más") }}{{ end }}
    </div>
    {{ range .p2 }}<p>{{ . | safeHTML }}</p>{{ end }}
  </div>
</section>
