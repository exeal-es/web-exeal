<section id="{{ .id }}" class="{{ partial "theme.html" .className }}">
  <div class="s-wrap">
{{ partial "arrow-header.html" . }}
    {{ with .subtitle }}<p>{{ . | safeHTML }}</p>{{ end }}
    <div class="ex-grid s-grid-3">
      {{ range .steps }}<div class="ex-feature"><span class="ex-dashnum" aria-hidden="true">{{ .number }}</span><h3>{{ .title }}</h3><p>{{ .description }}</p></div>{{ end }}
    </div>
  </div>
</section>
