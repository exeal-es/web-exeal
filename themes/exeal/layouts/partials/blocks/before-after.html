<section id="{{ .id }}" class="xb-before-after {{ .className }}">
  <div class="container">
    <div class="row xb-head">
      <div class="col-lg-10">
        {{ with .kicker }}<p class="xb-kicker">{{ . }}</p>{{ end }}
        <h2 class="xb-hook">{{ .header | safeHTML }}</h2>
      </div>
    </div>
    <div class="row xb-ba-head d-none d-md-flex mt-3">
      <div class="col-md-5">{{ .beforeLabel }}</div>
      <div class="col-md-1"></div>
      <div class="col-md-6">{{ .afterLabel }}</div>
    </div>
    {{ range .pairs }}
    <div class="row xb-ba-row">
      <div class="col-md-5 xb-ba-before">{{ .before | safeHTML }}</div>
      <div class="col-md-1 xb-ba-arrow d-none d-md-block">→</div>
      <div class="col-md-6 xb-ba-after">{{ .after | safeHTML }}</div>
    </div>
    {{ end }}
  </div>
</section>
