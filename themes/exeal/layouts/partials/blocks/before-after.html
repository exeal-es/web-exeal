<section id="{{ .id }}" class="{{ partial "theme.html" .className }}">
  <div class="s-wrap">
{{ partial "arrow-header.html" . }}
    <div class="ex-grid s-compare">
      <div class="ex-compare ex-compare--amber"><h3>{{ .beforeLabel }}</h3><div><ul class="ex-bullets">{{ range .pairs }}<li>{{ .before | safeHTML }}</li>{{ end }}</ul></div></div>
      <div class="ex-compare"><h3>{{ .afterLabel }}</h3><div><ul class="ex-bullets">{{ range .pairs }}<li>{{ .after | safeHTML }}</li>{{ end }}</ul></div></div>
    </div>
  </div>
</section>
