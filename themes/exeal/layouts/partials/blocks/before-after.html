<section id="{{ .id }}" class="{{ .className }}">
  <div class="container">
    {{- partial "arrow-header.html" (dict "header" .header) }}
    <div class="row">
      <div class="col-md-6">
        <h3>{{ .beforeLabel }}</h3>
        <ul class="row ticked-cross">
          {{ range .pairs }}<li class="col-md-12">{{ .before | safeHTML }}</li>{{ end }}
        </ul>
      </div>
      <div class="col-md-6">
        <h3>{{ .afterLabel }}</h3>
        <ul class="row ticked">
          {{ range .pairs }}<li class="col-md-12">{{ .after | safeHTML }}</li>{{ end }}
        </ul>
      </div>
    </div>
  </div>
</section>
