<section id="{{ .id }}" class="{{ partial "theme.html" .className }}">
  <div class="s-wrap">
{{ partial "arrow-header.html" . }}
    <div class="ex-split s-about">
      <blockquote class="ex-h2 s-vision">{{ .vision | safeHTML }}{{ with .visionLabel }}<small>{{ . }}</small>{{ end }}</blockquote>
      <div>
        {{ range .paragraphs }}<p>{{ . | safeHTML }}</p>{{ end }}
        {{ with .badges }}<ul class="s-tags">{{ range . }}<li class="ex-tag">{{ . }}</li>{{ end }}</ul>{{ end }}
      </div>
    </div>
  </div>
</section>
