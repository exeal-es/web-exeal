<section id="{{ .id }}" class="{{ partial "theme.html" .className }}">
  <div class="s-wrap">
{{- $c := .className }}
    {{ partial "arrow-header.html" . }}
    <div class="ex-grid s-grid-3">
      {{ range .elements }}<div class="ex-feature">{{ partial "icon.html" (dict "name" .icon "className" $c) }}<p>{{ .text | safeHTML }}</p></div>{{ end }}
    </div>
  </div>
</section>
