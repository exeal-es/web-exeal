<section id="{{ .id }}" class="{{ partial "theme.html" .className }}">
  <div class="s-wrap">
{{ partial "arrow-header.html" . }}
    <div class="ex-carousel s-carousel-2" tabindex="0" role="region" aria-label="Testimonios en vídeo">
      {{ range $i, $e := .testimonials }}{{ partial "video.html" (dict "url" .youtube "title" (printf "testimonio %d" (add $i 1))) }}{{ end }}
    </div>
    <div class="ex-dots">{{ range $i, $e := .testimonials }}<a href="#{{ $.id }}-{{ $i }}" aria-label="Ver {{ add $i 1 }}"{{ if not $i }} aria-current="true"{{ end }}></a>{{ end }}<a class="ex-dots__next" href="#{{ .id }}" aria-label="Siguiente"></a></div>
  </div>
</section>
