<section id="{{ .id }}" class="{{ partial "theme.html" .className }}">
  <div class="s-wrap">
{{ partial "arrow-header.html" . }}
    {{ with .subheader }}<p class="s-lead">{{ . }}</p>{{ end }}
    <div class="ex-grid s-grid-2">
      {{ range .casestudies }}
      <article class="ex-video-card">{{ partial "video.html" (dict "url" .youtube "title" .title) }}
        <div class="ex-video-card__body"><h3 class="ex-h4">{{ .title }}</h3><p class="ex-text ex-text--muted">{{ .description }}</p><a class="ex-button ex-button--hollow" href="{{ .link }}" aria-label="{{ .cta }}: {{ .title }}">{{ .cta }}</a></div>
      </article>
      {{ end }}
    </div>
  </div>
</section>
