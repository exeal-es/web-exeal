<section id="{{ .id }}" class="{{ partial "theme.html" .className }}">
  <div class="s-wrap">
<div class="ex-split s-split-rev">
      <div>
        {{ partial "arrow-header.html" . }}
        {{ with .p1 }}<p>{{ . | safeHTML }}</p>{{ end }}
        {{ with .p2 }}<p>{{ . | safeHTML }}</p>{{ end }}
        {{ with .callToAction }}<div class="s-actions">{{ partial "button.html" (merge . (dict "class" "ex-button--hollow")) }}</div>{{ end }}
      </div>
      <div>{{ with .image }}<img class="s-img" src="{{ . }}" alt="" loading="lazy">{{ end }}</div>
    </div>
  </div>
</section>
