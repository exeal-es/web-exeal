<section id="{{ .id }}" class="xb-manifesto {{ .className }}">
  <div class="container">
    {{- partial "arrow-header.html" (dict "header" .header) }}
    <div class="row">
      <div class="col-lg-10 offset-lg-2">
        <ol class="xb-manifesto-list">
          {{ range .lines }}<li><span>{{ . | safeHTML }}</span></li>{{ end }}
        </ol>
        {{ with .closing }}<p class="xb-manifesto-close">{{ . | safeHTML }}</p>{{ end }}
      </div>
    </div>
  </div>
</section>
