<section id="{{ .id }}" class="{{ partial "theme.html" .className }}">
  <div class="s-wrap">
{{ partial "arrow-header.html" . }}
    <ol class="ex-manifesto">{{ range .lines }}<li><span>{{ . | safeHTML }}</span></li>{{ end }}</ol>
    {{ with .closing }}<p class="ex-manifesto-close">{{ . | safeHTML }}</p>{{ end }}
  </div>
</section>
