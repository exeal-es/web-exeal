{{- $theme := partial "theme.html" (.className | default "dark") -}}
<section id="{{ .id }}" class="s-cta {{ $theme }}{{ if not (in $theme "s-bg") }} ex-motif ex-motif--code{{ end }}">
  <div class="s-wrap">
    <h2 class="ex-h1">{{ .header | safeHTML }}</h2>
    {{ with .p }}<p>{{ . | safeHTML }}</p>{{ end }}
    <div class="s-actions">{{ partial "button.html" (dict "text" .ctaLabel "href" .ctaHref) }}</div>
  </div>
</section>
