<section id="{{ .id }}" class="xb-hero {{ .className }}">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-lg-6">
        {{ with .kicker }}<p class="xb-kicker">{{ . }}</p>{{ end }}
        <h1>{{ .header | safeHTML }}</h1>
        <p class="xb-sub">{{ .subheader | safeHTML }}</p>
        <div class="xb-actions">
          {{ with .callToAction }}<a {{ if .href }}href="{{ .href }}"{{ else }}data-scroll="{{ .scrollTo }}" href="#"{{ end }} class="button">{{ .text }}</a>{{ end }}
          {{ with .secondaryCta }}<a {{ if .href }}href="{{ .href }}"{{ else }}data-scroll="{{ .scrollTo }}" href="#"{{ end }} class="xb-link">{{ .text }}</a>{{ end }}
        </div>
      </div>
      <div class="col-lg-6">
        <div class="xb-terminal" aria-hidden="true">
          <div class="xb-terminal-bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="title">{{ .terminal.title }}</span></div>
          <div class="xb-terminal-body">
            {{ range .terminal.lines }}<p class="{{ .kind }}">{{ .text | safeHTML }}</p>{{ end }}
            <p><span class="prompt">$</span> <span class="cursor"></span></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
