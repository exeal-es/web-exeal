<section id="{{ .id }}" class="{{ partial "theme.html" .className }}">
  <div class="s-wrap">
{{ partial "arrow-header.html" . }}
    {{ with .paragraph }}<p>{{ . | safeHTML }}</p>{{ end }}
    <ol class="ex-hexes">{{ range $i, $e := .blocks }}<li class="ex-hex" data-n="{{ add $i 1 }}"><b>{{ . | safeHTML }}</b></li>{{ end }}</ol>
    {{ with .callToAction }}<div class="s-actions">{{ partial "button.html" . }}</div>{{ end }}
  </div>
</section>
