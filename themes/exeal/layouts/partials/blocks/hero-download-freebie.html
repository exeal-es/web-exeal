<section id="{{ .id }}" class="{{ partial "theme.html" .className }}">
  <div class="s-wrap">
<div class="ex-split">
      <div class="s-hero"><h1 class="ex-h1">{{ .header | safeHTML }}</h1><p class="s-lead">{{ .subheader | safeHTML }}</p></div>
      <div>
        <template data-consent="medicion"><script src="https://f.convertkit.com/ckjs/ck.5.js"></script></template>
        <form class="ex-lead-form" id="form-checklist" method="post" action="{{ .formAction }}">
          {{ range .inputs }}<div class="ex-field"><label class="ex-field__label" for="{{ .name }}">{{ .placeholder }}</label><input class="ex-input" id="{{ .name }}" name="{{ .name }}" type="{{ .type }}" required></div>{{ end }}
          <input class="ex-button ex-button--accent ex-button--block" type="submit" name="submit" value="{{ .submitText }}">
        </form>
      </div>
    </div>
  </div>
</section>
