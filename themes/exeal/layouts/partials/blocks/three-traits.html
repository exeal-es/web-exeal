<section id="{{ .id }}" class="{{ partial "theme.html" .className }}">
  <div class="s-wrap">
{{- $c := .className }}
    {{ partial "arrow-header.html" . }}
    <div class="ex-grid s-grid-3">
      {{ range .traits }}<div class="ex-box"><span class="ex-box__flap ex-box__flap--tr"></span>{{ partial "icon.html" (dict "name" .icon "className" $c) }}{{ with .title }}<h3 class="ex-h4">{{ . }}</h3>{{ end }}<p>{{ .description | safeHTML }}</p></div>{{ end }}
    </div>
    {{ with .callToAction }}<div class="s-actions">{{ partial "button.html" . }}</div>{{ end }}
  </div>
</section>
