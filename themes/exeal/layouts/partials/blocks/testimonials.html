<section id="{{ .id }}" class="{{ partial "theme.html" .className }}">
  <div class="s-wrap">
<div class="ex-carousel" tabindex="0" role="region" aria-label="Testimonios">
      {{ range $i, $e := .testimonials }}{{ partial "quote.html" (merge . (dict "id" (printf "%s-%d" $.id $i))) }}{{ end }}
    </div>
    <div class="ex-dots">{{ range $i, $e := .testimonials }}<a href="#{{ $.id }}-{{ $i }}" aria-label="Ver {{ add $i 1 }}"{{ if not $i }} aria-current="true"{{ end }}></a>{{ end }}<a class="ex-dots__next" href="#{{ .id }}" aria-label="Siguiente"></a></div>
  </div>
</section>
